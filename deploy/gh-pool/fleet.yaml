apiVersion: apps/v1
kind: Deployment
metadata:
  name: gh-pool-keeper
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gh-pool-keeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gh-pool-keeper
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build
          image: ghcr.io/wprhvso/gh-pool
          imagePullPolicy: IfNotPresent
          command: ["gh-pool-keeper"]
          args:
            - build
            - -c
            - /run/secrets/keeper.toml
            - --source
            - /app/workflows
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: keeper
          image: ghcr.io/wprhvso/gh-pool
          imagePullPolicy: IfNotPresent
          command: ["gh-pool-keeper"]
          args: ["run", "-c", "/run/secrets/keeper.toml"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: gh-pool-fleet
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gh-pool-runners
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gh-pool-runners
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gh-pool-runners
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runners
          image: ghcr.io/wprhvso/gh-pool
          imagePullPolicy: IfNotPresent
          command: ["gh-pool-runners"]
          args: ["-c", "/run/secrets/runners.toml"]
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: gh-pool-fleet
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
