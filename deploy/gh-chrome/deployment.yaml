apiVersion: apps/v1
kind: Deployment
metadata:
  name: gh-chrome
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gh-chrome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gh-chrome
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 986
        runAsGroup: 983
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gh-chrome
          image: ghcr.io/wprhvso/gh-chrome:0.5.0@sha256:82c008fef79b0c1f745f111d654e5bd8b25377f85083c01f0090e0396cfc6663
          imagePullPolicy: IfNotPresent
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gh-chrome
                  key: db_password
            - name: GH_CHROME_DATABASE_URL
              value: postgresql://postgres:$(DB_PASSWORD)@$(HOST_IP):5432/gh_chrome
            - name: GH_CHROME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-chrome
                  key: token
            - name: GH_CHROME_POOL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gh-chrome
                  key: pool_token
            - name: GH_CHROME_POOL_SERVER
              valueFrom:
                secretKeyRef:
                  name: gh-chrome
                  key: pool_server
            - name: GH_CHROME_HOST
              value: 0.0.0.0
            - name: GH_CHROME_PORT
              value: "8001"
            - name: GH_CHROME_STORAGE
              value: /var/lib/gh-chrome
            - name: GH_CHROME_PUBLIC_URL
              value: https://chrome.murasya.ru
            - name: GH_CHROME_CLEANUP_MAX_BYTES
              value: "17179869184"
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/gh-chrome
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gh-chrome-data
        - name: tmp
          emptyDir: {}
