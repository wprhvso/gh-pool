[project]
name = "gh-chrome"
version = "0.1.6"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "python-xlib>=0.33",
    "uvicorn[standard]>=0.34",
    "websockets>=14.1",
]

[project.scripts]
gh-chrome = "gh_chrome_client.__main__:main"
gh-chrome-server = "gh_chrome_server.__main__:main"
gh-chrome-runner = "gh_chrome_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gh_chrome_client",
    "src/gh_chrome_protocol",
    "src/gh_chrome_runner",
    "src/gh_chrome_server",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["A", "ARG", "ASYNC", "B", "C4", "E", "ERA", "F", "I", "N", "PL", "PTH", "RET", "RUF", "S", "SIM", "UP", "W"]
ignore = [
    "ARG001",   # the command table takes an `args` it does not always read
    "ARG005",
    "ASYNC109", # `timeout` arguments are this library's public API
    "ASYNC110", # polling the DOM is the only signal a page gives us
    "ASYNC230", # small local files are opened synchronously on purpose
    "ASYNC240",
    "N818",     # exception names read better here without an Error suffix
    "PLR0913",
    "S101",
    "S108",     # /tmp is the workdir on a throwaway runner
    "S311",     # human-looking randomness, not cryptography
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"src/gh_chrome_runner/scroll.py" = ["PLR2004"]
"src/gh_chrome_runner/xtest.py" = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = [
    "gh_chrome_client",
    "gh_chrome_protocol",
    "gh_chrome_runner",
    "gh_chrome_server",
]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportImportCycles = false
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
reportUnannotatedClassAttribute = false
reportImplicitStringConcatenation = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
executionEnvironments = [{ root = "src", extraPaths = ["src"] }]
