[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-pool"
version = "0.1.3"
description = "Пул задач на раннерах GitHub Actions, браузерные сессии и флот раннеров"
readme = "README.md"
requires-python = ">=3.14"

# База намеренно пуста. Голый gh-pool ставится внутрь кода задачи ради
# `from gh_pool import emit`, а rpc.py и tasks.py написаны на одной стандартной
# библиотеке. Каждая лишняя зависимость здесь — секунды на старте каждой джобы.
dependencies = []

[project.optional-dependencies]
# Клиент: SDK задач и клиент браузерных сессий.
client = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "yaol>=0.3",
]

# То, что ставится в джобе рядом с Chrome. Держать узким: ставится через
# uv run --with на каждый запуск сессии.
browser = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-xlib>=0.33",
    "websockets>=14.1",
]

# Исполнитель задач: крутится на раннере, тянет задачи и пасёт подпроцессы.
worker = [
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "structlog>=25.4",
    "yaol>=0.3",
]

# gh-pool-server: API задач и сессий, диспатч, фоновые задачи, миграции.
server = [
    "alembic>=1.14",
    "anyio>=4.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.34",
    "yaol>=0.3",
]

# gh-pool-relay: только долгие сокеты. Ни httpx (некому диспатчить), ни
# python-multipart (аплоады идут сырым потоком), ни alembic (миграции гоняет
# server), ни pynacl.
relay = [
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
]

# Кипер и флот раннеров: ходят в GitHub, шифруют секреты репозиториев.
fleet = [
    "opentelemetry-api>=1.29",
    "pynacl>=1.5",
    "structlog>=25.4",
    "yaol>=0.3",
]

[project.scripts]
gh-pool = "gh_pool.cli:main"
gh-pool-server = "gh_pool.server.__main__:main"
gh-pool-relay = "gh_pool.relay.__main__:main"
gh-pool-worker = "gh_pool.worker:main"
gh-pool-keeper = "gh_pool.fleet.workers:main"
gh-pool-runners = "gh_pool.fleet.runners.__main__:cli"
gh-pool-migrate = "gh_pool.db.migrate:upgrade_now"
gh-pool-browser = "gh_pool.browser.__main__:main"

[dependency-groups]
dev = [
    "gh-pool[browser,client,fleet,relay,server,worker]",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gh_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "browser: водит настоящий Chrome на настоящем X-дисплее",
    "recording: нужен ffmpeg, чтобы писать экран",
    "patient_watchdog: сторож не должен торопить сессию",
]
