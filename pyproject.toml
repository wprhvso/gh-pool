[project]
name = "gh-chrome"
version = "0.2.1"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[project.optional-dependencies]
runner = [
    "pydantic-settings>=2.7",
    "python-xlib>=0.33",
    "websockets>=14.1",
]
server = [
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
gh-chrome = "gh_chrome_client.__main__:main"
gh-chrome-server = "gh_chrome_server.__main__:main"
gh-chrome-runner = "gh_chrome_runner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/gh_chrome_client",
    "src/gh_chrome_protocol",
    "src/gh_chrome_runner",
    "src/gh_chrome_server",
]

[dependency-groups]
dev = ["gh-chrome[runner,server]", "pytest>=8.3", "pytest-asyncio>=0.25"]
