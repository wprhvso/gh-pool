[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gh-pool"
version = "0.1.5"
description = "A task pool on GitHub Actions runners, plus browser sessions and a runner fleet"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wprhvso", email = "wprhvso@gmail.com" }]
keywords = ["github-actions", "task-queue", "runners", "chrome", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]

# The base is empty on purpose. Bare gh-pool is installed into the task's own
# code just for `from gh_pool import emit`, and rpc.py and tasks.py are written
# against the standard library alone. Every extra dependency here is seconds off
# the start of every job.
dependencies = []

[project.urls]
Repository = "https://github.com/wprhvso/gh-pool"
Issues = "https://github.com/wprhvso/gh-pool/issues"

[project.optional-dependencies]
# Client: the task SDK and the browser session client.
client = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "yaol>=0.3",
]

# What gets installed in the job next to Chrome. Keep it narrow: it is installed
# through uv run --with on every session start.
browser = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-xlib>=0.33",
    "websockets>=14.1",
]

# The task executor: runs on the runner, pulls tasks and herds subprocesses.
worker = [
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "structlog>=25.4",
    "yaol>=0.3",
]

# gh-pool-server: the task and session API, dispatch, background chores, migrations.
server = [
    "alembic>=1.14",
    "anyio>=4.4",
    "fastapi>=0.115",
    "httpx>=0.28",
    "opentelemetry-api>=1.29",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.20",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=25.4",
    "uvicorn[standard]>=0.34",
    "yaol>=0.3",
]

# gh-pool-relay: long sockets only. No httpx (nothing to dispatch), no
# python-multipart (uploads stream raw), no alembic (server runs the
# migrations), no pynacl.
relay = [
    "fastapi>=0.115",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "uvicorn[standard]>=0.34",
    "yaol>=0.3",
]

# The keeper and the runner fleet: they talk to GitHub and seal repository secrets.
fleet = [
    "opentelemetry-api>=1.29",
    "pynacl>=1.5",
    "structlog>=25.4",
    "yaol>=0.3",
]

[project.scripts]
gh-pool = "gh_pool.cli:main"
gh-pool-server = "gh_pool.server.__main__:main"
gh-pool-relay = "gh_pool.relay.__main__:main"
gh-pool-worker = "gh_pool.worker:main"
gh-pool-keeper = "gh_pool.fleet.workers:main"
gh-pool-runners = "gh_pool.fleet.runners.__main__:cli"
gh-pool-migrate = "gh_pool.db.migrate:upgrade_now"
gh-pool-browser = "gh_pool.browser.__main__:main"

[dependency-groups]
dev = [
    "gh-pool[browser,client,fleet,relay,server,worker]",
    "basedpyright>=1.39",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gh_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true
markers = [
    "browser: drives a real Chrome on a real X display",
    "recording: needs ffmpeg to record the screen",
    "patient_watchdog: the watchdog must not hurry the session",
]
