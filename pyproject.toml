[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pool-runners"
version = "0.1.0"
description = "Self-hosted раннеры GitHub Actions на воркерах пула"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/wprhvso/pool-runners"

[project.scripts]
pool-runners = "pool_runners.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["pool_runners"]

[tool.hatch.build.targets.sdist]
include = ["pool_runners", "README.md", "runners.toml.example"]
