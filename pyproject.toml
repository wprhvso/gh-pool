[project]
name = "pool"
version = "0.1.0"
description = "GitHub Actions as a generic worker pool"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "anyio>=4.4",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "yaol>=0.2",
]

[project.optional-dependencies]
keeper = ["pynacl>=1.5"]

[project.scripts]
pool = "pool.cli:main"
pool-server = "pool.server:main"
pool-worker = "pool.worker:main"
pool-keeper = "pool.keeper:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pool"]
