target-version = "py313"

line-length = 88

src = ["src", "python"]

[lint]
select = ["ALL"]

ignore = [
    "D",
    "CPY001",
    "COM812",
    "ISC001",
    "E501",
    "ANN401",
    "TC001",
    "TC002",
    "TC003",
    "ARG001",
    "ARG005",
    "B008",
    "FBT001",
    "FBT002",
    "FBT003",
    "PLR0913",
    "PLR0917",
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "SIM117",
    "BLE001",
    "EM101",
    "EM102",
    "TRY003",
    "TRY301",
    "TRY400",
    "N818",
    "ASYNC109",
    "ASYNC110",
    "ASYNC230",
    "ASYNC240",
    "S105",
    "S108",
    "S311",
    "S603",
    "S607",
    "INP001",
    "PLC0415",
    "SLF001",
    "RUF001",
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
"tests/**" = ["ANN", "PLR6301", "S101", "S105", "S106", "S603", "S607", "SLF001"]
"tests_python/**" = ["ANN", "PLR6301", "S101", "S105", "S106", "S603", "S607", "SLF001"]
"conftest.py" = ["ANN", "S101"]
"migrations/**" = ["ERA001"]
"**/__main__.py" = ["T201"]
"**/cli.py" = ["T201"]
"**/cli/**" = ["T201"]
"example/**" = ["T201", "T203"]
"examples/**" = ["T201", "T203"]

[lint.flake8-annotations]
suppress-dummy-args = true
allow-star-arg-any = true

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
