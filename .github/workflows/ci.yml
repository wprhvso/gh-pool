name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, format, pyright, pytest]
    steps:
      - uses: actions/checkout@v7
      - uses: wprhvso/qa-python@v1
        with:
          checks: ${{ matrix.check }}

  e2e:
    runs-on: pool
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: end-to-end
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GH_CHROME_TEST_DATABASE_URL: postgresql://postgres:end-to-end@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb openbox x11-utils ffmpeg zstd

      - run: command -v google-chrome

      - uses: wprhvso/qa-python@v1
        with:
          checks: pytest
          pytest-args: tests/e2e -ra --durations=15

  nix:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - uses: wprhvso/qa-nix@v1
        with:
          checks: fmt,statix,deadnix,flake

  shell:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
      - uses: wprhvso/qa-shell@v1
