name: ci

on:
  push:
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, format, pyright, pytest]
    steps:
      - uses: actions/checkout@v7
      - uses: wprhvso/qa-python@v1
        with:
          enable-cache: true

  nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix flake check -L
