name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  python:
    runs-on: pool
    strategy:
      fail-fast: false
      matrix:
        check: [format, pytest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: wprhvso/qa-python@v1
        with:
          checks: ${{ matrix.check }}

  shell:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: wprhvso/qa-shell@v1
