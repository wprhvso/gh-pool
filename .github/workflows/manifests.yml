name: manifests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: поставить kustomize и kubeconform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          grab() {
            local repo=$1 suffix=$2 url
            url=$(gh api "repos/$repo/releases/latest" \
              | jq -r --arg s "$suffix" \
                  'first(.assets[] | select(.name | endswith($s)) | .browser_download_url)')
            [ -n "$url" ] && [ "$url" != null ] \
              || { echo "::error::не нашёл в релизе $repo файл на $suffix"; exit 1; }
            curl -fsSL "$url" | tar xz -C "$RUNNER_TEMP/bin"
          }
          grab kubernetes-sigs/kustomize _linux_amd64.tar.gz
          grab yannh/kubeconform -linux-amd64.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: kustomize build + kubeconform
        run: |
          set -euo pipefail
          mapfile -t dirs < <(
            find deploy -name kustomization.yaml -printf '%h\n' | sort
          )
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::не найдено ни одного kustomization.yaml в deploy/"
            exit 1
          fi
          rc=0
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            kustomize build "$dir" \
              | kubeconform -strict -ignore-missing-schemas \
                  -kubernetes-version 1.35.7 -summary || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  yaml:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uvx yamllint --strict --format github deploy
