name: manifests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  kustomize:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: kustomize build + kubeconform
        shell: nix shell nixpkgs#kustomize nixpkgs#kubeconform -c bash -euo pipefail {0}
        run: |
          mapfile -t dirs < <(
            find deploy -name kustomization.yaml -printf '%h\n' | sort
          )
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::не найдено ни одного kustomization.yaml в deploy/"
            exit 1
          fi
          rc=0
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            kustomize build "$dir" \
              | kubeconform -strict -ignore-missing-schemas \
                  -kubernetes-version 1.35.7 -summary || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  yaml:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: yamllint
        run: nix shell nixpkgs#yamllint -c yamllint --strict --format github deploy
