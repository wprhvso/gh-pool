name: manifests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kustomize:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: kustomize build + kubeconform
        run: |
          set -euo pipefail
          mapfile -t dirs < <(
            find deploy -name kustomization.yaml -printf '%h\n' | sort
          )
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "::error::не найдено ни одного kustomization.yaml в deploy/"
            exit 1
          fi
          rc=0
          for dir in "${dirs[@]}"; do
            echo "::group::$dir"
            kustomize build "$dir" \
              | kubeconform -strict -ignore-missing-schemas \
                  -kubernetes-version 1.35.7 -summary || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  yaml:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: yamllint --strict --format github deploy
