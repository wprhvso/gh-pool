name: gh-chrome

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: gh-chrome session id
        required: true
        type: string

env:
  KASMVNC_VERSION: "1.5.0"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installed rather than restored from a package cache. The cache holds
      # the packages that were asked for and not what they link against, and an
      # ffmpeg that cannot find libblas records nothing at all — quietly: the
      # recorder logs the exit and the session goes on answering commands with
      # no video behind it. This is also the job that holds the token, which is
      # no place for a third-party action pinned to a moving tag.
      - run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb openbox xdotool x11-utils zstd ffmpeg \
            ssl-cert xauth x11-xkb-utils xkb-data xfonts-base libgbm1 \
            libswitch-perl libyaml-tiny-perl libhash-merge-simple-perl \
            liblist-moreutils-perl libtry-tiny-perl libdatetime-perl \
            libdatetime-timezone-perl
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=64x64:rate=1 \
            -frames:v 1 -f mp4 /dev/null

      # The live desktop is a bonus: a session without KasmVNC still records and
      # still answers commands, so a bad release asset must not fail the job.
      - name: install KasmVNC
        continue-on-error: true
        run: |
          set -euo pipefail
          arch=$(dpkg --print-architecture)
          for codename in "$(. /etc/os-release && echo "$VERSION_CODENAME")" noble; do
            deb="kasmvncserver_${codename}_${KASMVNC_VERSION}_${arch}.deb"
            url="https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/${deb}"
            if curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/$deb" "$url"; then
              sudo apt-get update -qq || true
              sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/$deb"
              command -v Xkasmvnc
              test -f /usr/share/kasmvnc/www/index.html
              exit 0
            fi
            echo "no KasmVNC build for $codename"
          done
          exit 1

      # Every other consumer of this code — the image, the checks — is built
      # from uv.lock. Resolving the ranges in pyproject.toml fresh at dispatch
      # time would make the one artifact users actually run the only one whose
      # dependencies nothing has ever tested together.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev --extra runner

      - run: uv run --frozen --no-dev gh-chrome-runner --session ${{ inputs.session_id }}
        env:
          GH_CHROME_URL: ${{ secrets.GH_CHROME_URL }}
          GH_CHROME_TOKEN: ${{ secrets.GH_CHROME_TOKEN }}
          GH_CHROME_WORKDIR: ${{ runner.temp }}/gh-chrome

      - if: always()
        run: tail -n 50 ${{ runner.temp }}/gh-chrome/logs/*.log
