name: pool

on:
  workflow_dispatch:

env:
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "26.3.11579264"
  KASMVNC_VERSION: "1.5.0"
  TOOLS: /opt/pool-tools/bin
  GRADLE_CACHE_URL: https://gradle-cache.murasya.ru/cache/
  ATTIC_CACHE: https://cache.murasya.ru/main
  ATTIC_PUBLIC_KEY: main:SVD81ZpWoLp4D1U6xdyfPEEcaez5fH6DdSlQUBikZZ4=

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-start@main
        with:
          remote-write-url: ${{ secrets.PROMETHEUS_REMOTE_WRITE_URL }}
          username: ${{ secrets.PROMETHEUS_REMOTE_WRITE_USERNAME }}
          password: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}
          job-name: worker
          scrape-interval: 15s

      - name: preseed runner (background)
        run: |
          cache=$HOME/.cache/pool-runners
          mkdir -p "$cache"
          chmod 700 "$cache"
          echo "RUNNER_CACHE=$cache" >>"$GITHUB_ENV"
          # shellcheck disable=SC2016
          nohup setsid bash -c '
            set -uo pipefail
            cache=$HOME/.cache/pool-runners
            latest=https://github.com/actions/runner/releases/latest
            url=$(curl -fsSLI -o /dev/null -w "%{url_effective}" --retry 3 "$latest") || exit 1
            version=${url##*/tag/v}
            case "$version" in "" | *[!0-9.]*) exit 1 ;; esac
            case "$(uname -m)" in x86_64) cpu=x64 ;; aarch64) cpu=arm64 ;; *) exit 1 ;; esac
            name=actions-runner-linux-$cpu-$version.tar.gz
            if [ ! -s "$cache/$name" ]; then
              curl -fsSL --retry 3 -o "$cache/$name.part" \
                "https://github.com/actions/runner/releases/download/v$version/$name" || exit 1
              mv "$cache/$name.part" "$cache/$name"
            fi
            printf "%s" "$version" >"$cache/.preseeded"
          ' >"$RUNNER_TEMP/preseed.log" 2>&1 &
          echo "предзагрузка раннера пошла фоном"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: free disk

      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[789]* \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: system deps

      - name: system deps
        timeout-minutes: 35
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          stamp() {
            while IFS= read -r line; do
              printf '%(%H:%M:%S)T %s\n' -1 "$line"
            done
          }
          apt_do() {
            local what="$1" attempt
            for attempt in 1 2; do
              printf 'попытка %s: apt-get %s\n' "$attempt" "$what"
              if sudo -E timeout -k 15 900 apt-get -y --no-install-recommends \
                -o quiet=0 \
                -o Dpkg::Use-Pty=0 \
                -o Dpkg::Options::=--force-confold \
                -o Dpkg::Options::=--force-confdef \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                "$@" </dev/null 2>&1 | stamp; then
                return 0
              fi
              echo "::warning::apt-get $what не дошёл с попытки $attempt"
              spill
            done
            return 1
          }
          spill() {
            echo "--- последние строки /var/log/apt/term.log ---"
            sudo tail -n 120 /var/log/apt/term.log 2>/dev/null | stamp
            echo "--- последние строки /var/log/dpkg.log ---"
            sudo tail -n 60 /var/log/dpkg.log 2>/dev/null | stamp
            echo "--- что делает dpkg/apt прямо сейчас ---"
            ps -C apt-get,apt,dpkg,debconf -o pid,stat,wchan:24,etimes,args || true
          }
          trap 'spill' TERM INT
          apt_do update
          apt_do install \
            ffmpeg imagemagick p7zip-full jq curl wget git build-essential \
            unzip zip tar gzip xz-utils zstd rsync openssh-client ca-certificates \
            age sqlite3 postgresql-client \
            xvfb openbox xdotool x11-utils xauth x11-xkb-utils xkb-data \
            xfonts-base libgbm1 ssl-cert \
            libswitch-perl libyaml-tiny-perl libhash-merge-simple-perl \
            liblist-moreutils-perl libtry-tiny-perl libdatetime-perl \
            libdatetime-timezone-perl
          sudo mkdir -p "$TOOLS"
          arch=$(dpkg --print-architecture)
          for codename in "$(. /etc/os-release && echo "$VERSION_CODENAME")" noble; do
            deb=kasmvncserver_${codename}_${KASMVNC_VERSION}_${arch}.deb
            url=https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/$deb
            echo "пробую $deb"
            if curl -fSL --retry 3 --retry-all-errors --max-time 180 \
              -o "$RUNNER_TEMP/$deb" "$url"; then
              apt_do install "$RUNNER_TEMP/$deb" && break
            fi
          done
          command -v Xkasmvnc || echo "::warning::KasmVNC не встал — живой рабочий стол недоступен"
          spill
          echo "$TOOLS" >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: nix

      - name: nix
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if ! command -v nix >/dev/null; then
            curl -fsSL --retry 3 https://nixos.org/nix/install | sh -s -- --daemon --yes --no-channel-add
          fi
          sudo mkdir -p /etc/nix
          if [[ -n $ATTIC_TOKEN ]]; then
            printf 'machine cache.murasya.ru password %s\n' "$ATTIC_TOKEN" \
              | sudo tee /etc/nix/netrc >/dev/null
            sudo chmod 600 /etc/nix/netrc
            cache_conf=$(
              printf 'extra-substituters = %s\n' "$ATTIC_CACHE"
              printf 'extra-trusted-public-keys = %s\n' "$ATTIC_PUBLIC_KEY"
              printf 'netrc-file = /etc/nix/netrc\n'
            )
          else
            echo "::warning::ATTIC_TOKEN пуст — воркер идёт без приватного кеша"
            cache_conf=""
          fi
          {
            printf 'experimental-features = nix-command flakes\n'
            printf 'max-jobs = auto\n'
            printf 'fallback = true\n'
            printf 'connect-timeout = 5\n'
            printf '%s' "$cache_conf"
          } | sudo tee /etc/nix/nix.conf >/dev/null
          sudo systemctl restart nix-daemon
          echo /nix/var/nix/profiles/default/bin >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: nix qa tools

      - name: nix qa tools
        run: |
          export PATH=/nix/var/nix/profiles/default/bin:$PATH
          nix profile install --accept-flake-config \
            nixpkgs#nixfmt-rfc-style nixpkgs#statix nixpkgs#deadnix \
            nixpkgs#stylua nixpkgs#selene nixpkgs#attic-client \
            nixpkgs#govulncheck nixpkgs#golangci-lint \
            nixpkgs#shellcheck nixpkgs#shfmt nixpkgs#actionlint nixpkgs#yamllint \
            nixpkgs#ktlint nixpkgs#detekt nixpkgs#cargo-audit nixpkgs#just
          echo "$HOME/.nix-profile/bin" >>"$GITHUB_PATH"

      - name: attic login
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [[ -z $ATTIC_TOKEN ]]; then
            echo "ATTIC_TOKEN пуст — пропускаю"
            exit 0
          fi
          export PATH="$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
          attic login murasya https://cache.murasya.ru "$ATTIC_TOKEN"

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: python qa tools
        run: |
          uv tool install ruff
          uv tool install basedpyright
          uv tool install pytest --with pytest-asyncio
          uv tool update-shell || true
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: go path
        run: echo "$HOME/go/bin" >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: rust

      - name: rust
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rustfmt --component clippy
          rustup default nightly

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: java and gradle

      - name: java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >>"$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: release

      - name: gradle remote cache
        env:
          GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
        run: |
          if [[ -z $GRADLE_CACHE_USER || -z $GRADLE_CACHE_PASSWORD ]]; then
            echo "::warning::учётных данных нет — gradle пойдёт без удалённого кеша"
            exit 0
          fi
          mkdir -p "$HOME/.gradle"
          {
            printf 'gradleCacheUrl=%s\n' "$GRADLE_CACHE_URL"
            printf 'gradleCacheUsername=%s\n' "$GRADLE_CACHE_USER"
            printf 'gradleCachePassword=%s\n' "$GRADLE_CACHE_PASSWORD"
          } >"$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -u "$GRADLE_CACHE_USER:$GRADLE_CACHE_PASSWORD" \
            "${GRADLE_CACHE_URL}probe-$(id -u)")
          case "$code" in
            404 | 200) echo "кеш отвечает $code — доступ есть" ;;
            401) echo "::error::кеш отверг учётные данные (401)" ; exit 1 ;;
            *) echo "::warning::кеш ответил $code" ;;
          esac

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: android sdk

      - name: android sdk
        run: |
          sdk=$ANDROID_SDK_ROOT
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" >/dev/null
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$sdk/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$sdk/ndk/${ANDROID_NDK_VERSION}"
          } >>"$GITHUB_ENV"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: earthly

      - name: earthly
        run: |
          sudo curl -fsSL --retry 3 -o "$TOOLS/earthly" \
            https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64
          sudo chmod +x "$TOOLS/earthly"
          sudo "$TOOLS/earthly" bootstrap

      - name: verify toolchain
        run: |
          for t in nix uv ruff basedpyright pytest go golangci-lint govulncheck \
                   cargo rustc cargo-audit ktlint detekt \
                   shellcheck shfmt actionlint yamllint earthly just gradle java \
                   nixfmt statix deadnix node docker; do
            printf '%-16s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          df -h /

      - name: wait for preseed
        run: |
          for _ in $(seq 1 30); do
            if [ -s "$RUNNER_CACHE/.preseeded" ]; then
              echo "раннер $(cat "$RUNNER_CACHE/.preseeded") лежит в кеше"
              ls -la "$RUNNER_CACHE"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::предзагрузка раннера не успела"
          tail -5 "$RUNNER_TEMP/preseed.log" 2>/dev/null || true

      - name: python deps
        run: uv sync --frozen --no-dev --extra worker

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: run worker

      - name: run worker
        env:
          POOL_SERVER: ${{ secrets.GH_POOL_SERVER }}
          POOL_TOKEN: ${{ secrets.GH_POOL_WORKER_TOKEN }}
          WORKER_ID: gh-${{ github.run_id }}
        run: |
          WORKER_MAX_AGE=$((16200 + RANDOM % 2700))
          export WORKER_MAX_AGE
          echo "воркер отработает $((WORKER_MAX_AGE / 60)) мин"
          uv run gh-pool-worker

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-stop@main
        if: always()
