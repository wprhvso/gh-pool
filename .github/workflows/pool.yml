name: pool

on:
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ffmpeg imagemagick p7zip-full jq curl git build-essential

      - name: python deps
        run: uv sync --frozen --no-dev

      - name: run worker
        env:
          POOL_SERVER: ${{ secrets.POOL_SERVER }}
          POOL_TOKEN: ${{ secrets.POOL_TOKEN }}
          WORKER_ID: gh-${{ github.run_id }}
        run: uv run pool-worker
