name: pool

on:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.3"
  GOLANGCI_VERSION: "v2.12.2"
  KTLINT_VERSION: "1.8.0"
  DETEKT_VERSION: "1.23.8"
  SHELLCHECK_VERSION: "v0.11.0"
  SHFMT_VERSION: "v3.13.1"
  ACTIONLINT_VERSION: "1.7.12"
  GRADLE_VERSION: "9.7.0"
  ANDROID_PLATFORM: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "26.3.11579264"
  CARGO_AUDIT_VERSION: "0.22.2"
  KASMVNC_VERSION: "1.5.0"
  TOOLS: /opt/pool-tools/bin
  GRADLE_CACHE_URL: https://gradle-cache.murasya.ru/cache/
  ATTIC_CACHE: https://cache.murasya.ru/main
  ATTIC_PUBLIC_KEY: main:SVD81ZpWoLp4D1U6xdyfPEEcaez5fH6DdSlQUBikZZ4=

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Воркер живёт часами и умирает молча: изнутри джобы не видно ни OOM,
      # ни упёршегося диска, ни того, на каком шаге всё встало. job-name задан
      # руками, поэтому actions: read не нужен и в API экшен не ходит.
      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-start@main
        with:
          remote-write-url: ${{ secrets.PROMETHEUS_REMOTE_WRITE_URL }}
          username: ${{ secrets.PROMETHEUS_REMOTE_WRITE_USERNAME }}
          password: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}
          job-name: worker
          scrape-interval: 15s

      # Первая же джоба на свежем воркере иначе платит скачивание раннера (~200 МБ)
      # из своего времени. Кладём архив туда, откуда его возьмёт pool-runners:
      # agent.cache() — это $HOME/.cache/pool-runners, имя файла фиксировано.
      # Версию резолвим так же, как gh.release_version(). Расхождение безопасно —
      # промах кеша означает сегодняшнее поведение.
      - name: preseed runner (background)
        run: |
          cache=$HOME/.cache/pool-runners
          mkdir -p "$cache"
          chmod 700 "$cache"
          echo "RUNNER_CACHE=$cache" >>"$GITHUB_ENV"
          # Кавычки одинарные намеренно: тело раскрывается в дочернем процессе.
          # shellcheck disable=SC2016
          nohup setsid bash -c '
            set -uo pipefail
            cache=$HOME/.cache/pool-runners
            latest=https://github.com/actions/runner/releases/latest
            url=$(curl -fsSLI -o /dev/null -w "%{url_effective}" --retry 3 "$latest") || exit 1
            version=${url##*/tag/v}
            case "$version" in "" | *[!0-9.]*) exit 1 ;; esac
            case "$(uname -m)" in x86_64) cpu=x64 ;; aarch64) cpu=arm64 ;; *) exit 1 ;; esac
            name=actions-runner-linux-$cpu-$version.tar.gz
            if [ ! -s "$cache/$name" ]; then
              curl -fsSL --retry 3 -o "$cache/$name.part" \
                "https://github.com/actions/runner/releases/download/v$version/$name" || exit 1
              mv "$cache/$name.part" "$cache/$name"
            fi
            printf "%s" "$version" >"$cache/.preseeded"
          ' >"$RUNNER_TEMP/preseed.log" 2>&1 &
          echo "предзагрузка раннера пошла фоном"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: free disk

      # Образ ubuntu-latest занимает почти весь диск предустановленными SDK,
      # которыми пул не пользуется. Без этого не влезают nix, NDK и Rust nightly.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[789]* \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          df -h /

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: system deps

      # Шаг вставал насмерть: пять прогонов держали по слоту три с лишним часа,
      # а джобу отпускает только timeout-minutes, то есть почти шесть часов.
      # DEBIAN_FRONTEND и </dev/null — чтобы приглашение debconf (postinst
      # KasmVNC) падало, а не ждало ввода; timeout-minutes — граница на всё
      # остальное, что может подвиснуть на сети.
      - name: system deps
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          # Раньше стоял -qq, поэтому от зависшего шага не оставалось ни строки и
          # причину приходилось угадывать. Теперь метка времени на каждой строке:
          # при обрыве по таймауту последняя строка и покажет, где встало.
          # printf вместо date — иначе форк на каждую строку.
          stamp() {
            while IFS= read -r line; do
              printf '%(%H:%M:%S)T %s\n' -1 "$line"
            done
          }
          # Debug::pkgAcquire::Worker сюда не годится: на одном update он даёт
          # 400 строк URL-кодированных редиректов зеркал и хоронит под собой то,
          # ради чего всё и затевалось — что именно распаковывает и настраивает
          # dpkg. Вместо отладки загрузок ставим им таймауты, чтобы залипшее
          # зеркало отваливалось быстро, а не держало шаг.
          apt_do() {
            sudo -E apt-get -y --no-install-recommends \
              -o Dpkg::Use-Pty=0 \
              -o Dpkg::Options::=--force-confold \
              -o Dpkg::Options::=--force-confdef \
              -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 \
              -o Acquire::Retries=3 \
              "$@" </dev/null 2>&1 | stamp
          }
          spill() {
            echo "--- последние строки /var/log/apt/term.log ---"
            sudo tail -n 120 /var/log/apt/term.log 2>/dev/null | stamp
            echo "--- последние строки /var/log/dpkg.log ---"
            sudo tail -n 60 /var/log/dpkg.log 2>/dev/null | stamp
            # STAT и WCHAN важнее списка имён: они и покажут, ждёт ли процесс
            # ввода, висит в D-состоянии на диске или сидит в сетевом ожидании.
            echo "--- что делает dpkg/apt прямо сейчас ---"
            ps -C apt-get,apt,dpkg,debconf -o pid,stat,wchan:24,etimes,args || true
          }
          # На обрыв по timeout-minutes раннер шлёт сигнал: успеваем вывалить логи.
          trap 'spill' TERM INT
          apt_do update
          apt_do install \
            ffmpeg imagemagick p7zip-full jq curl wget git build-essential \
            unzip zip tar gzip xz-utils zstd rsync openssh-client ca-certificates \
            age sqlite3 postgresql-client \
            xvfb openbox xdotool x11-utils xauth x11-xkb-utils xkb-data \
            xfonts-base libgbm1 ssl-cert \
            libswitch-perl libyaml-tiny-perl libhash-merge-simple-perl \
            liblist-moreutils-perl libtry-tiny-perl libdatetime-perl \
            libdatetime-timezone-perl
          sudo mkdir -p "$TOOLS"
          arch=$(dpkg --print-architecture)
          for codename in "$(. /etc/os-release && echo "$VERSION_CODENAME")" noble; do
            deb=kasmvncserver_${codename}_${KASMVNC_VERSION}_${arch}.deb
            url=https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/$deb
            echo "пробую $deb"
            if curl -fSL --retry 3 --retry-all-errors --max-time 180 \
              -o "$RUNNER_TEMP/$deb" "$url"; then
              apt_do install "$RUNNER_TEMP/$deb" && break
            fi
          done
          command -v Xkasmvnc || echo "::warning::KasmVNC не встал — живой рабочий стол недоступен"
          spill
          echo "$TOOLS" >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: nix

      # Инсталлятор nix не идемпотентен: на переиспользуемом воркере вторая
      # попытка падает на уже существующем /etc/bash.bashrc.backup-before-nix.
      # Поэтому ставим ровно один раз здесь, а qa-nix потом установку пропускает.
      # nix.conf и netrc — файлы на машине, а не переменные окружения, поэтому
      # их видят и вложенные джобы раннера. Настраиваем кеш один раз здесь, и
      # тянуть из него будут все репозитории, которым он и не нужен явно.
      - name: nix
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if ! command -v nix >/dev/null; then
            curl -fsSL --retry 3 https://nixos.org/nix/install | sh -s -- --daemon --yes --no-channel-add
          fi
          sudo mkdir -p /etc/nix
          if [[ -n $ATTIC_TOKEN ]]; then
            printf 'machine cache.murasya.ru password %s\n' "$ATTIC_TOKEN" \
              | sudo tee /etc/nix/netrc >/dev/null
            sudo chmod 600 /etc/nix/netrc
            cache_conf=$(
              printf 'extra-substituters = %s\n' "$ATTIC_CACHE"
              printf 'extra-trusted-public-keys = %s\n' "$ATTIC_PUBLIC_KEY"
              printf 'netrc-file = /etc/nix/netrc\n'
            )
          else
            echo "::warning::ATTIC_TOKEN пуст — воркер идёт без приватного кеша"
            cache_conf=""
          fi
          {
            printf 'experimental-features = nix-command flakes\n'
            printf 'max-jobs = auto\n'
            # Кеш может лежать, а сборка от этого падать не должна.
            printf 'fallback = true\n'
            printf 'connect-timeout = 5\n'
            printf '%s' "$cache_conf"
          } | sudo tee /etc/nix/nix.conf >/dev/null
          sudo systemctl restart nix-daemon
          echo /nix/var/nix/profiles/default/bin >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: nix qa tools

      - name: nix qa tools
        run: |
          export PATH=/nix/var/nix/profiles/default/bin:$PATH
          nix profile install --accept-flake-config \
            nixpkgs#nixfmt-rfc-style nixpkgs#statix nixpkgs#deadnix \
            nixpkgs#stylua nixpkgs#selene nixpkgs#attic-client nixpkgs#govulncheck
          echo "$HOME/.nix-profile/bin" >>"$GITHUB_PATH"

      # Конфиг клиента ложится в $HOME, который у вложенных джоб тот же, так что
      # логинимся один раз тут — дальше attic push работает без токена в репе.
      - name: attic login
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [[ -z $ATTIC_TOKEN ]]; then
            echo "ATTIC_TOKEN пуст — пропускаю"
            exit 0
          fi
          export PATH="$HOME/.nix-profile/bin:/nix/var/nix/profiles/default/bin:$PATH"
          attic login murasya https://cache.murasya.ru "$ATTIC_TOKEN"

      - name: uv
        run: |
          curl -LsSf --retry 3 https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: go
        run: |
          curl -fsSL --retry 3 -o /tmp/go.tar.gz \
            "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
          sudo rm -rf /usr/local/go
          sudo tar -C /usr/local -xzf /tmp/go.tar.gz
          echo /usr/local/go/bin >>"$GITHUB_PATH"
          echo "$HOME/go/bin" >>"$GITHUB_PATH"

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: go tools

      - name: go tools
        run: |
          export PATH=/usr/local/go/bin:$HOME/go/bin:$PATH
          curl -fsSL --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/golangci/golangci-lint/${GOLANGCI_VERSION}/install.sh" \
            | sh -s -- -b "$TOOLS" "$GOLANGCI_VERSION"
          # govulncheck приезжает из nixpkgs вместе с остальными qa-тулами: сборка
          # из исходников занимала почти весь этот шаг ради той же версии.
          govulncheck -version 2>/dev/null | head -2

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: rust

      - name: rust
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rustfmt --component clippy
          rustup default nightly
          base=https://github.com/rustsec/rustsec/releases/download
          tgz=cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}.tgz
          curl -fsSL --retry 3 \
            "$base/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/$tgz" \
            | sudo tar -xz -C "$TOOLS" --strip-components=1 --wildcards '*/cargo-audit'

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: java and gradle

      - name: java and gradle
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >>"$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >>"$GITHUB_PATH"
          curl -fsSL --retry 3 -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >>"$GITHUB_PATH"

      # ~/.gradle тот же, что у вложенных джоб, поэтому учётные данные кеша
      # кладём сюда, а не в каждый android-репозиторий.
      - name: gradle remote cache
        env:
          GRADLE_CACHE_USER: ${{ secrets.GRADLE_CACHE_USER }}
          GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}
        run: |
          if [[ -z $GRADLE_CACHE_USER || -z $GRADLE_CACHE_PASSWORD ]]; then
            echo "::warning::учётных данных нет — gradle пойдёт без удалённого кеша"
            exit 0
          fi
          mkdir -p "$HOME/.gradle"
          {
            printf 'gradleCacheUrl=%s\n' "$GRADLE_CACHE_URL"
            printf 'gradleCacheUsername=%s\n' "$GRADLE_CACHE_USER"
            printf 'gradleCachePassword=%s\n' "$GRADLE_CACHE_PASSWORD"
          } >"$HOME/.gradle/gradle.properties"
          chmod 600 "$HOME/.gradle/gradle.properties"

          # Без этой проверки неверные учётные данные означают тихую деградацию
          # на локальный кеш: сборка зелёная, кеш пустой, и никто не знает.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -u "$GRADLE_CACHE_USER:$GRADLE_CACHE_PASSWORD" \
            "${GRADLE_CACHE_URL}probe-$(id -u)")
          case "$code" in
            404 | 200) echo "кеш отвечает $code — доступ есть" ;;
            401) echo "::error::кеш отверг учётные данные (401)" ; exit 1 ;;
            *) echo "::warning::кеш ответил $code" ;;
          esac

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: android sdk

      - name: android sdk
        run: |
          sdk=$ANDROID_SDK_ROOT
          yes | "$sdk/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$sdk/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}" >/dev/null
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_HOME=$sdk"
            echo "ANDROID_NDK_HOME=$sdk/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$sdk/ndk/${ANDROID_NDK_VERSION}"
          } >>"$GITHUB_ENV"

      - name: kotlin qa tools
        run: |
          curl -fsSL --retry 3 -o "$TOOLS/ktlint" \
            "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x "$TOOLS/ktlint"
          curl -fsSL --retry 3 -o /tmp/detekt.zip \
            "https://github.com/detekt/detekt/releases/download/v${DETEKT_VERSION}/detekt-cli-${DETEKT_VERSION}.zip"
          sudo unzip -q -o /tmp/detekt.zip -d /opt
          sudo ln -sf "/opt/detekt-cli-${DETEKT_VERSION}/bin/detekt-cli" "$TOOLS/detekt"

      - name: shell qa tools
        run: |
          sc=https://github.com/koalaman/shellcheck/releases/download
          curl -fsSL --retry 3 \
            "$sc/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ -C "$TOOLS" --strip-components=1 \
              "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          sudo curl -fsSL --retry 3 -o "$TOOLS/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          sudo chmod +x "$TOOLS/shfmt"
          al=https://github.com/rhysd/actionlint/releases/download
          curl -fsSL --retry 3 \
            "$al/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C "$TOOLS" actionlint

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: earthly and just

      - name: earthly and just
        run: |
          sudo curl -fsSL --retry 3 -o "$TOOLS/earthly" \
            https://github.com/earthly/earthly/releases/latest/download/earthly-linux-amd64
          sudo chmod +x "$TOOLS/earthly"
          sudo "$TOOLS/earthly" bootstrap
          curl -fsSL --retry 3 https://just.systems/install.sh \
            | sudo bash -s -- --to "$TOOLS"

      - name: verify toolchain
        run: |
          for t in nix uv go golangci-lint govulncheck cargo rustc ktlint detekt \
                   shellcheck shfmt actionlint earthly just gradle java node docker; do
            printf '%-16s %s\n' "$t" "$(command -v "$t" || echo MISSING)"
          done
          df -h /

      # Предзагрузка шла параллельно бутстрапу и к этому моменту почти наверняка
      # закончилась. Не дождались — не беда, agent скачает архив сам.
      - name: wait for preseed
        run: |
          for _ in $(seq 1 30); do
            if [ -s "$RUNNER_CACHE/.preseeded" ]; then
              echo "раннер $(cat "$RUNNER_CACHE/.preseeded") лежит в кеше"
              ls -la "$RUNNER_CACHE"
              exit 0
            fi
            sleep 2
          done
          echo "::warning::предзагрузка раннера не успела"
          tail -5 "$RUNNER_TEMP/preseed.log" 2>/dev/null || true

      - name: python deps
        run: uv sync --frozen --no-dev

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-mark@main
        with:
          step: run worker

      - name: run worker
        env:
          POOL_SERVER: ${{ secrets.POOL_SERVER }}
          POOL_TOKEN: ${{ secrets.POOL_TOKEN }}
          WORKER_ID: gh-${{ github.run_id }}
        run: |
          # Уходим заметно раньше timeout-minutes и вразнобой: иначе когорта,
          # поднятая одним холодным стартом, вымирает разом и ёмкость проваливается.
          # Воркер дорабатывает текущую задачу и только потом выходит.
          WORKER_MAX_AGE=$((16200 + RANDOM % 2700))
          export WORKER_MAX_AGE
          echo "воркер отработает $((WORKER_MAX_AGE / 60)) мин"
          uv run pool-worker

      - uses: wprhvso/github-runner-node-exporter/.github/actions/runner-metrics-stop@main
        if: always()
