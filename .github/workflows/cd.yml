name: cd

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: pool
    outputs:
      version: ${{ steps.read.outputs.version }}
      prerelease: ${{ steps.read.outputs.prerelease }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: read
        run: |
          version=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *[!0-9.]*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          earthly --ci --push +multi \
            --VERSION="${{ needs.version.outputs.version }}" \
            --LATEST="${{ needs.version.outputs.prerelease == 'false' }}"

  pypi:
    needs: [version, image]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: uv build --out-dir dist
      - run: uv publish

  tag:
    needs: [version, image, pypi]
    if: needs.version.outputs.release == 'true'
    runs-on: pool
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
